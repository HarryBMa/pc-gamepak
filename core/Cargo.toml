[package]
name = "gamepak-core"
version = "0.1.0"
edition = "2021"
description = "Cartridge logic shared by the launcher and the wizard, free of any UI"
license = "MIT"

# No Tauri, deliberately. Nothing here needs a webview or a display, so
# `cargo test` runs on any machine and in CI without webkit2gtk — which is the
# whole point of the split.
[dependencies]
# Only to turn chosen artwork into the .ico Explorer needs for a drive icon.
# png+jpeg decode is the whole of it: no GIF, no WebP, no default formats. The
# pin is exact because 0.25.10 wants rustc 1.88 while rust-toolchain.toml holds
# this repo at 1.87 — a caret range lets `cargo update` break the build.
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
urlencoding = "2.1"

# drives.rs enumerates volumes through the Win32 API. Without this the crate
# does not compile for Windows at all, which is how it stayed broken: CI checks
# core on Linux only, and every Windows job failed later, in the launcher.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # Asking a volume which bus its disk is on, so a cartridge can be told from
    # an internal data disk that reports the same drive type.
    "Win32_System_Ioctl",
    "Win32_System_IO",
    # CreateFileW's SECURITY_ATTRIBUTES parameter lives here, so the file API is
    # not exposed without it.
    "Win32_Security",
] }
