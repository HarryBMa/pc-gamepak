<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC GamePak</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!--
    The window is a slot with a cartridge seated in it. #face carries everything
    printed on the cartridge and rides out of the slot on Eject, revealing the
    empty #slot underneath.
  -->
  <main id="card" aria-labelledby="game-title">

    <!-- What is behind the cartridge. Only ever seen once one has been ejected. -->
    <div id="slot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" width="26" height="26"
           aria-hidden="true">
        <rect x="4" y="3" width="16" height="18" rx="2" />
        <path d="M8 7h8M8 21v-4h8v4" />
      </svg>
      <p id="slot-label">Slot empty</p>
      <button id="btn-insert" type="button">Insert cartridge</button>
    </div>

    <div id="face" data-tauri-drag-region>

      <!-- The art. Two layers so a collection can cross-fade between games. -->
      <div id="plate" aria-hidden="true">
        <img id="cover-img" alt="" hidden />
        <img id="cover-img-b" alt="" hidden />
        <div id="cover-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
               stroke-linecap="round" stroke-linejoin="round" width="52" height="52">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M3 15l5-4 4 3 3-2 6 4" />
            <circle cx="9" cy="9" r="1.4" />
          </svg>
          <p>No cover art</p>
        </div>
      </div>

      <!-- Scrims: the art is arbitrary, so the type cannot rely on it being dark. -->
      <div id="scrim-top" aria-hidden="true"></div>
      <div id="scrim-bottom" aria-hidden="true"></div>

      <!-- Top chrome. Present only while the pointer is in the window. -->
      <header id="chrome" data-tauri-drag-region>
        <div id="chrome-actions">
          <button id="btn-input" class="chip" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" width="13" height="13"
                 aria-hidden="true">
              <path d="M6 12h4M8 10v4" />
              <circle cx="15.5" cy="11" r="1" />
              <circle cx="17.8" cy="13.4" r="1" />
              <path d="M7.4 6.6h9.2a4.4 4.4 0 0 1 4.3 5.3l-.7 3.6a2.6 2.6 0 0 1-4.6 1l-1-1.4H9.4l-1 1.4a2.6 2.6 0 0 1-4.6-1l-.7-3.6a4.4 4.4 0 0 1 4.3-5.3z" />
            </svg>
            <span id="input-label">Keyboard</span>
          </button>
          <button id="btn-details" class="icon-btn" type="button"
                  aria-expanded="false" aria-controls="sheet"
                  aria-label="Cartridge details" title="Details">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" width="14" height="14" aria-hidden="true">
              <circle cx="8" cy="8" r="6.2" />
              <path d="M8 5.1v.1M8 7.4v3.6" />
            </svg>
            <!-- The one action a pad reaches by its own button rather than by focus. -->
            <span class="pad-badge" aria-hidden="true">Y</span>
          </button>
          <button id="btn-close" class="icon-btn icon-btn--close" type="button"
                  aria-label="Dismiss" title="Dismiss — Esc">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" width="14" height="14" aria-hidden="true">
              <path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2" />
            </svg>
          </button>
        </div>
      </header>

      <!-- The game, and the only two things to do with it -->
      <footer id="stage">
        <!-- The cartridge's own name. Only a collection has one worth printing,
             because a single game already says its name in the title. -->
        <p id="eyebrow" hidden></p>

        <img id="title-logo" alt="" hidden />
        <h1 id="game-title">Reading cartridge…</h1>

        <!-- The only explanation of why Play is disabled, so it is announced. -->
        <p id="notice" role="status" hidden></p>

        <!-- Collection: the rail picks which game Play acts on. -->
        <ul id="game-list" hidden aria-label="Games on this cartridge"></ul>

        <div id="button-row">
          <span id="play-ring">
            <button id="btn-play" class="btn btn--play" type="button" disabled>
              <span class="btn__label">Play</span>
              <kbd class="btn__key" aria-hidden="true">&crarr;</kbd>
              <svg class="btn__pad-icon" viewBox="0 0 16 16" fill="currentColor"
                   width="11" height="11" aria-hidden="true">
                <path d="M4.6 3.1l8 4.9-8 4.9z" />
              </svg>
              <span class="btn__sweep" aria-hidden="true"></span>
            </button>
          </span>
          <button id="btn-eject" class="btn btn--eject" type="button" disabled
                  aria-label="Eject" title="Eject — E">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" width="16" height="16"
                 aria-hidden="true">
              <path d="M8 2.8L13.8 9H2.2z" />
              <path d="M2.8 12.5h10.4" />
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <!-- Details, on request only -->
    <aside id="sheet" hidden aria-label="Cartridge details">
      <header id="sheet-head">
        <h2 id="sheet-id">
          <img id="sheet-thumb" alt="" hidden />
          <span id="sheet-names">
            <span id="sheet-title">Cartridge</span>
            <span id="sheet-sub"></span>
          </span>
        </h2>
        <button id="btn-sheet-close" class="icon-btn" type="button" aria-label="Close details">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" width="14" height="14" aria-hidden="true">
            <path d="M4.4 4.4l7.2 7.2M11.6 4.4l-7.2 7.2" />
          </svg>
        </button>
      </header>

      <div id="sheet-body">
        <!-- The two readings the sheet is actually opened for. -->
        <div id="readings"></div>
        <dl id="specs"></dl>

        <!-- Paths are the least-read thing here, so they start folded. -->
        <button id="btn-paths" class="disclosure" type="button" aria-expanded="false"
                aria-controls="paths">
          <svg class="disclosure__caret" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
               width="11" height="11" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" />
          </svg>
          <span id="paths-label">Show file paths</span>
        </button>
        <dl id="paths" hidden></dl>
      </div>

      <footer id="sheet-footer">
        <button id="btn-sheet-back" class="sheet-back" type="button">Back to game</button>
        <!-- The wizard's settings are only reachable from here, so the link
             stays; it just stops competing with the way out. -->
        <button id="btn-open-settings" class="sheet-link" type="button">
          Settings…
        </button>
      </footer>
    </aside>

    <p id="toast" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
