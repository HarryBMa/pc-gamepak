# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# The release artefact is a zip, not an installer, because there is nothing to
# install: two self-contained executables and the scripts that register the
# watcher. WinGet unpacks it and puts both binaries on PATH as portable
# commands; it does not and cannot create the logon task, which is why the
# description tells the user to run install.ps1 once. See ReleaseNotes below.
#
# InstallerSha256 comes from the .sha256 the release workflow uploads beside the
# zip. The value below was checked against a fresh download of the published
# asset, not copied from the workflow log.

PackageIdentifier: HarryBMa.PCGamePak
PackageVersion: 1.1.0

MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: pc-gamepak-1.1.0-windows-x86_64\pc-gamepak.exe
    PortableCommandAlias: pc-gamepak
  - RelativeFilePath: pc-gamepak-1.1.0-windows-x86_64\pc-gamepak-watcher.exe
    PortableCommandAlias: pc-gamepak-watcher

UpgradeBehavior: install
ReleaseDate: 2026-10-03

Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/HarryBMa/pc-gamepak/releases/download/v1.1.0/pc-gamepak-1.1.0-windows-x86_64.zip
    InstallerSha256: 98E6F95F376C84303F5015FD316ECBED172F0B0022D556F45EC405CBF3EF21E9

ManifestType: installer
ManifestVersion: 1.6.0
